stages:

  ingest:
    cmd: python src/data/ingest.py --dataset_root ${data.dataset_root} --manifest_out data/manifest.json
    deps:
      - src/data/ingest.py
      - ${data.dataset_root}
    params:
      - params.yaml:
          - data.dataset_root
    outs:
      - data/manifest.json

  validate:
    cmd: python src/data/validate.py --manifest data/manifest.json --params params.yaml
    deps:
      - src/data/validate.py
      - data/manifest.json
      - ${data.dataset_root}
    params:
      - params.yaml:
          - data.dataset_root
          - validation
    outs:
      - data/validation_report.json

  prepare:
    cmd: python src/data/prepare.py --params params.yaml
    deps:
      - src/data/prepare.py
      - data/validation_report.json
      - ${data.dataset_root}
    params:
      - params.yaml:
          - data.dataset_root
          - data.output_root
          - data.frame_skip
          - data.frame_skip_no_gun
          - data.train_split
    outs:
      - data/processed

  train_baseline:
    cmd: python src/train/train_baseline.py --params params.yaml
    deps:
      - src/train/train_baseline.py
      - data/processed
    params:
      - params.yaml:
          - baseline
          - data.output_root
          - mlflow
    outs:
      - models/baseline_best.pt

  train_main:
    cmd: python src/train/train_main.py --params params.yaml
    deps:
      - src/train/train_main.py
      - data/processed
    params:
      - params.yaml:
          - main
          - data.output_root
          - mlflow
    outs:
      - models/main_best.pt

  evaluate:
    cmd: python src/evaluate/evaluate.py --params params.yaml
    deps:
      - src/evaluate/evaluate.py
      - models/baseline_best.pt
      - models/main_best.pt
      - data/processed
    params:
      - params.yaml:
          - data.output_root
          - mlflow
    metrics:
      - metrics.json:
          cache: false
